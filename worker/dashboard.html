<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex 任务看板</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e4e3df;
    --accent: #2f6fed; --user: #eef3fe; --agent: #ffffff; --tool: #f3f2ef;
    --ok: #1f8a4c; --run: #c77700; --bad: #c43d3d; --idle: #8a8a85;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #1f1f1d; --text: #ecebe7; --muted: #9a9993; --line: #33332f;
      --accent: #7aa2ff; --user: #1f2a44; --agent: #232321; --tool: #2a2a27;
      --ok: #4cc27f; --run: #f0a33a; --bad: #ef6b6b; --idle: #8a8a85;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .meta { color: var(--muted); font-size: 12px; margin-left: auto; display: flex; gap: 12px; align-items: center; }
  button, .link { font: inherit; color: var(--accent); background: none; border: 0; cursor: pointer; padding: 0; text-decoration: none; }
  main { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 53px); }
  #list { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
  .session { padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .session:hover { background: var(--bg); }
  .session.active { background: var(--user); }
  .session .name { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .session .sub { color: var(--muted); font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .s-completed { color: var(--ok); } .s-running, .s-queued { color: var(--run); }
  .s-failed, .s-timed_out, .s-interrupted { color: var(--bad); } .s-cancelled { color: var(--idle); }
  #detail { overflow-y: auto; padding: 16px 20px 40px; }
  #detail .head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 4px; }
  #detail .head h2 { font-size: 18px; margin: 0; }
  #detail .info { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
  #detail .info code { font-size: 11px; }
  .note { font-size: 12px; color: var(--muted); background: var(--tool); border-radius: 8px; padding: 8px 10px; margin-bottom: 16px; }
  .msg { max-width: 860px; margin: 0 0 12px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); white-space: pre-wrap; word-break: break-word; }
  .msg .who { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .msg.user { background: var(--user); }
  .msg.agent { background: var(--agent); }
  .msg.fork { background: none; border-style: dashed; color: var(--muted); font-size: 12px; }
  details.tool { max-width: 860px; margin: 0 0 12px; background: var(--tool); border-radius: 8px; padding: 6px 10px; font-size: 12px; color: var(--muted); }
  details.tool pre { white-space: pre-wrap; word-break: break-word; margin: 6px 0 0; }
  .empty { color: var(--muted); padding: 40px 20px; text-align: center; }
  #profile { padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--bg); font-size: 12px; }
  #profile .title { font-weight: 600; font-size: 14px; display: flex; gap: 8px; align-items: center; }
  #profile .facts { color: var(--muted); margin-top: 4px; }
  #profile .role { margin-top: 6px; }
  #profile .agent { margin-top: 8px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  #profile .agent .tags { color: var(--muted); }
  .section { padding: 8px 16px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--line); }
  #login { position: fixed; inset: 0; background: var(--bg); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 5; }
  #login form { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; width: 100%; max-width: 420px; }
  #login h2 { margin: 0 0 8px; font-size: 16px; }
  #login p { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
  #login input { width: 100%; font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  #login .row { display: flex; justify-content: flex-end; margin-top: 12px; }
  #login .primary { background: var(--accent); color: #fff; padding: 6px 14px; border-radius: 8px; }
  .back { display: none; }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; height: auto; }
    #list { border-right: 0; }
    body.viewing #list { display: none; }
    body:not(.viewing) #detail { display: none; }
    .back { display: inline; }
    #detail { padding: 12px 16px 40px; }
  }
</style>
</head>
<body>
<header>
  <h1>Codex 任务看板</h1>
  <span id="computer" class="badge" style="color: var(--muted)"></span>
  <div class="meta"><span id="updated"></span><button id="logout" type="button">更换令牌</button></div>
</header>
<main>
  <div id="list"><div class="empty">加载中…</div></div>
  <div id="detail"><div class="empty">选择左侧的一个会话查看对话内容</div></div>
</main>
<div id="login">
  <form id="login-form">
    <h2>输入服务令牌</h2>
    <p>令牌在派任务服务的 client.local.json 或 token.txt 里。只保存在这个浏览器中，用来读取任务数据。</p>
    <input id="token" type="password" autocomplete="off" placeholder="粘贴令牌" required>
    <div class="row"><button class="primary" type="submit">查看</button></div>
  </form>
</div>
<script>
(() => {
  const STATUS = { completed: '完成', running: '运行中', queued: '排队', failed: '失败', timed_out: '超时', interrupted: '中断', cancelled: '已取消' };
  const store = {
    get() { try { return localStorage.getItem('codexTasksToken') || ''; } catch { return ''; } },
    set(v) { try { localStorage.setItem('codexTasksToken', v); } catch {} },
    clear() { try { localStorage.removeItem('codexTasksToken'); } catch {} },
  };
  let token = store.get();
  let groups = [];
  let selected = null;
  let transcriptKey = '';
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const time = (iso) => iso ? new Date(iso).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '';

  async function api(path) {
    const res = await fetch(path, { headers: { Authorization: 'Bearer ' + token }, cache: 'no-store' });
    if (res.status === 401) { showLogin(); throw new Error('unauthorized'); }
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
    return res.json();
  }
  function showLogin() { $('login').style.display = 'flex'; $('token').focus(); }
  $('login-form').addEventListener('submit', (e) => {
    e.preventDefault(); token = $('token').value.trim(); store.set(token); $('login').style.display = 'none'; refresh();
  });
  $('logout').addEventListener('click', () => { store.clear(); token = ''; showLogin(); });

  // Group tasks into sessions. A fork made while the desktop app held a session stays in the same group.
  function buildGroups(tasks) {
    const parent = {};
    for (const t of tasks) if (t.forked_from_thread_id && t.thread_id) parent[t.thread_id] = t.forked_from_thread_id;
    const root = (id) => { const seen = new Set(); while (parent[id] && !seen.has(id)) { seen.add(id); id = parent[id]; } return id; };
    const byRoot = new Map();
    for (const t of [...tasks].reverse()) {
      const key = t.thread_id ? root(t.thread_id) : 'pending-' + t.task_id;
      if (!byRoot.has(key)) byRoot.set(key, { key, tasks: [] });
      byRoot.get(key).tasks.push(t);
    }
    return [...byRoot.values()].map((g) => {
      const latest = g.tasks[g.tasks.length - 1];
      const busy = g.tasks.find((t) => t.status === 'running' || t.status === 'queued');
      return { ...g, latest, name: g.tasks[0].name || '未命名任务', status: busy ? busy.status : latest.status,
               thread: [...g.tasks].reverse().find((t) => t.thread_id)?.thread_id,
               forks: new Set(g.tasks.map((t) => t.thread_id).filter(Boolean)).size - 1,
               updated: latest.finished_at || latest.started_at || latest.created_at };
    }).sort((a, b) => (b.updated || '').localeCompare(a.updated || ''));
  }

  let profile = null;
  function renderProfile() {
    const box = el('div'); box.id = 'profile';
    if (!profile) return box;
    const m = profile.machine || {}, c = profile.computer || {};
    const title = el('div', 'title'); title.append(el('span', null, profile.computer_name || m.hostname || '本机'));
    if (profile.busy && profile.busy.running.length) title.append(el('span', 'badge s-running', '忙：' + profile.busy.running.join('、')));
    else title.append(el('span', 'badge s-completed', '空闲'));
    const gpu = (m.nvidia && m.nvidia.length) ? m.nvidia.map((g) => g.name + ' ' + Math.round(g.vram_total_mb / 1024) + 'GB').join('、')
      : (m.gpus || []).map((g) => g.name).filter((n) => !/virtual|remote|basic/i.test(n)).join('、') || '无独立显卡';
    const facts = [m.cpu, m.ram_gb && (m.ram_gb + 'GB 内存'), gpu, m.os, m.egress_country && ('出口 ' + m.egress_country)].filter(Boolean).join(' · ');
    box.append(title, el('div', 'facts', facts));
    if (m.checked_at) box.append(el('div', 'facts', '硬件信息检测于 ' + time(m.checked_at)));
    box.append(el('div', 'role', c.role ? '用途：' + c.role : '用途：未填写'));
    if (c.software && c.software.length) box.append(el('div', 'facts', '软件：' + c.software.join('、')));
    for (const a of c.accounts || []) box.append(el('div', 'facts', '账号：' + a.site + (a.account ? '（' + a.account + '）' : '') + ' · ' + ({ logged_in: '已登录', logged_out: '未登录', needs_verification: '需要验证' }[a.status] || a.status || '未知')));
    for (const a of profile.agents || []) {
      const card = el('div', 'agent');
      const head = el('div', 'name'); head.append(el('b', null, a.name + (a.type === 'main' ? '（主）' : '')));
      if (a.status) head.append(document.createTextNode(' '), el('span', 'badge s-' + a.status, STATUS[a.status] || a.status));
      card.append(head, el('div', null, a.role || ''));
      if (a.tags && a.tags.length) card.append(el('div', 'tags', a.tags.map((t) => '#' + t).join(' ')));
      card.addEventListener('click', () => {
        const g = groups.find((x) => x.name === a.name);
        if (g) { selected = g.key; transcriptKey = ''; document.body.classList.add('viewing'); renderList(); renderDetail(true); }
      });
      box.append(card);
    }
    return box;
  }

  function renderList() {
    const list = $('list'); list.replaceChildren(renderProfile(), el('div', 'section', '会话'));
    if (!groups.length) { list.append(el('div', 'empty', '还没有任务')); return; }
    for (const g of groups) {
      const row = el('div', 'session' + (selected === g.key ? ' active' : ''));
      const name = el('div', 'name'); name.append(el('span', null, g.name), el('span', 'badge s-' + g.status, STATUS[g.status] || g.status));
      const last = g.latest.latest_message || g.latest.error || g.latest.result || '';
      row.append(name, el('div', 'sub', time(g.updated) + ' · ' + g.tasks.length + ' 轮' + (g.forks ? ' · 分叉 ' + g.forks : '')), el('div', 'sub', last.replace(/\s+/g, ' ')));
      row.addEventListener('click', () => { selected = g.key; transcriptKey = ''; document.body.classList.add('viewing'); renderList(); renderDetail(true); });
      list.append(row);
    }
  }

  async function renderDetail(force) {
    const g = groups.find((x) => x.key === selected);
    if (!g) return;
    const key = g.thread + '|' + g.latest.task_id + '|' + g.latest.status + '|' + (g.latest.latest_message || '').length;
    if (!force && key === transcriptKey && g.status !== 'running') return;
    transcriptKey = key;
    const detail = $('detail');
    const head = el('div', 'head');
    const back = el('button', 'back', '← 返回'); back.type = 'button';
    back.addEventListener('click', () => { document.body.classList.remove('viewing'); selected = null; renderList(); });
    head.append(back, el('h2', null, g.name), el('span', 'badge s-' + g.status, STATUS[g.status] || g.status));
    const info = el('div', 'info');
    info.append(document.createTextNode(g.tasks.length + ' 轮 · 工作目录 ' + (g.latest.workspace || '') + ' · 会话 '), el('code', null, g.thread || '尚未创建'));
    const note = el('div', 'note');
    note.append(document.createTextNode('这里只读查看，不会占用会话。'));
    if (g.thread) {
      const open = el('a', 'link', '在 Codex App 中打开'); open.href = 'codex://threads/' + encodeURIComponent(g.thread);
      note.append(document.createTextNode(' 想亲自接着聊时可以 '), open, document.createTextNode('。注意：打开后这个会话就归你了，在 Codex 完全退出之前，Agent 不能再往里面派任务。只想看进度的话，留在这个页面就好。'));
    }
    const body = el('div');
    if (g.thread) {
      try {
        const { entries } = await api('/api/transcript?thread_id=' + encodeURIComponent(g.thread));
        if (!entries.length) body.append(el('div', 'empty', '还没有对话内容'));
        for (const e of entries) {
          if (e.kind === 'tool') {
            const d = el('details', 'tool'); d.append(el('summary', null, '工具调用 · ' + e.type + ' · ' + time(e.time)), el('pre', null, e.text)); body.append(d);
          } else {
            const m = el('div', 'msg ' + e.kind);
            const who = { user: '收到的指令', agent: 'Codex 回复', fork: '分叉' }[e.kind] || e.kind;
            m.append(el('div', 'who', who + ' · ' + time(e.time)), document.createTextNode(e.text));
            body.append(m);
          }
        }
      } catch (err) { if (err.message !== 'unauthorized') body.append(el('div', 'empty', '读取对话失败：' + err.message)); }
    }
    for (const t of g.tasks.filter((t) => t.status === 'failed' || t.status === 'timed_out')) {
      const m = el('div', 'msg fork'); m.textContent = '任务 ' + t.task_id.slice(0, 8) + ' ' + (STATUS[t.status] || t.status) + '：' + (t.error || ''); body.append(m);
    }
    const stick = detail.scrollTop + detail.clientHeight >= detail.scrollHeight - 40;
    detail.replaceChildren(head, info, note, body);
    if (stick || force) detail.scrollTop = detail.scrollHeight;
  }

  async function refresh() {
    if (!token) { showLogin(); return; }
    try {
      if (!profile || Date.now() - (profile._loaded || 0) > 30000) {
        profile = await api('/api/profile'); profile._loaded = Date.now();
      }
      const data = await api('/api/tasks');
      $('computer').textContent = data.computer || '';
      groups = buildGroups(data.tasks.filter((t) => !t.archived)); // archived in the Codex app = removed by the user
      renderList();
      if (selected) await renderDetail(false);
      $('updated').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN');
    } catch (err) { if (err.message !== 'unauthorized') $('updated').textContent = '连接失败，稍后重试'; }
  }
  refresh();
  setInterval(refresh, 4000);
})();
</script>
</body>
</html>
